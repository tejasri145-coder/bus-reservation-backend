# Server Configuration
server.port=${PORT:8080}

# Application Name
spring.application.name=bus-reservation-backend

# MySQL Database Configuration
# Supports DB_URL, DB_USERNAME, DB_PASSWORD environment variables with local defaults
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bus_reservation?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Open-in-view configuration
spring.jpa.open-in-view=false

# Date & Time serialization settings
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
